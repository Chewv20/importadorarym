<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión — Importadora RYM</title>
    <meta name="theme-color" content="#2A3A8F">
    <!--
      Página de respaldo que muestra el Service Worker cuando no hay red.
      Es autocontenida a propósito (estilos propios) porque debe verse aunque
      el CSS externo no esté disponible. Única excepción a la regla no-inline.
    -->
    <style>
        :root { --blue:#2A3A8F; --lime:#CEDC00; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,var(--blue),#005EB8); color:#fff; padding:1.5rem; text-align:center;
        }
        .box { max-width:420px; }
        .mark {
            width:96px; height:96px; margin:0 auto 1.5rem; border-radius:24px; background:var(--blue);
            display:grid; place-items:center; border:4px solid var(--lime);
            font-weight:800; font-size:1.75rem; letter-spacing:.05em;
        }
        h1 { font-size:1.6rem; margin-bottom:.75rem; }
        p { color:rgba(255,255,255,.9); line-height:1.6; margin-bottom:1.5rem; }
        button {
            font:inherit; font-weight:600; cursor:pointer; color:var(--blue); background:#fff;
            border:0; border-radius:999px; padding:.8rem 1.8rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="mark">RYM</div>
        <h1>Estás sin conexión</h1>
        <p>No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo. El contenido que ya visitaste sigue disponible.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
